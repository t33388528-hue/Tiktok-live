services:
  - type: web
    name: tiktok-live-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_CONNECTIONS
        value: "10"
      - key: AUTO_CONNECT_USERNAME
        value: ChilledLuck
      - key: DISCORD_EVENTS
        value: gift,social,subscribe,streamEnd
      - key: DISCORD_WEBHOOK_URL
        sync: false
