name: ChilledLuck LIVE check

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_discord:
        description: Send the Discord test message through Render
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chilledluck-live-check
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-24.04
    env:
      RENDER_SERVICE_URL: https://tiktok-live-7jlz.onrender.com
      MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
      TIKTOK_USERNAME: ChilledLuck
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Explain missing secret
        if: env.MONITOR_TOKEN == ''
        run: echo 'Add the MONITOR_TOKEN repository secret to enable scheduled checks.'

      - name: Check ChilledLuck LIVE status
        if: env.MONITOR_TOKEN != '' && (github.event_name == 'schedule' || inputs.test_discord != true)
        run: node scripts/check-live.js

      - name: Send Discord test through Render
        if: env.MONITOR_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.test_discord == true
        run: |
          node --input-type=module -e '
            const response = await fetch(`${process.env.RENDER_SERVICE_URL}/api/test/discord`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.MONITOR_TOKEN}` }
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Render returned HTTP ${response.status}: ${body}`);
            console.log(body);
          '

